<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Page not found - Nikhil Gupta">
<title>Page not found · Nikhil Gupta</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%233b82f6%22/></svg>">
<style>
:root {
    /* GitHub Light (Default) */
    --bg: #ffffff;
    --fg: #24292f;
    --acc: #0969da;
    --sub: #57606a;
}
html[data-theme="dark"] {
    /* GitHub Dark Dimmed */
    --bg: #22272e;
    --fg: #adbac7;
    --acc: #539bf5;
    --sub: #768390;
}
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
    background-color: var(--bg);
    color: var(--fg);
    line-height: 1.6;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.4s ease, color 0.4s ease;
    font-size: 18px;
}
main {
    width: 100%;
    max-width: 600px;
    padding: 2.5rem;
    animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    opacity: 0;
    transform: translateY(12px);
    outline: 1px solid var(--sub);
    border-radius: 12px;
}
@media (max-width: 600px) {
    main {
        padding: 1.5rem;
        border-radius: 0;
        outline: none;
        max-width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }
    body {
        align-items: flex-start;
    }
}
@keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
}
header {
    margin-bottom: 2.5rem;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
}
h1 {
    margin: 0;
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -0.03em;
}
.dot-slot {
    width: 10px;
    height: 10px;
    flex-shrink: 0;
}
.dot {
    position: fixed;
    z-index: 2;
    width: 10px;
    height: 10px;
    background-color: var(--acc);
    border-radius: 50%;
    cursor: grab;
    touch-action: none;
    will-change: left, top;
}
.dot.dragging {
    cursor: grabbing;
}
.message h2 {
    margin: 0 0 0.75rem;
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.03em;
}
.message p {
    margin: 0 0 1.5rem;
    font-size: 1.1rem;
}
a {
    color: inherit;
    text-decoration: none;
    position: relative;
    transition: color 0.2s ease;
    padding: 4px 0;
}
a:hover {
    color: var(--acc);
}
.message a::after, #version::after {
    content: '';
    position: absolute;
    width: 100%;
    transform: scaleX(0);
    height: 2px;
    bottom: 4px;
    left: 0;
    background-color: var(--acc);
    transform-origin: bottom right;
    transition: transform 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}
.message a:hover::after, #version:hover::after {
    transform: scaleX(1);
    transform-origin: bottom left;
}
#version {
    position: relative;
}
#version:hover {
    color: var(--acc) !important;
}
footer {
    margin-top: 3rem;
    padding-top: 1rem;
    border-top: 1px solid var(--sub);
    color: var(--sub);
    font-size: 0.8rem;
}
.copy-toast {
    position: fixed;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    pointer-events: none;
    color: var(--acc);
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.7);
    will-change: transform, opacity;
}
.copy-toast svg {
    width: 16px;
    height: 16px;
}
.copy-toast.show {
    animation: copy-float 0.7s ease-out forwards;
}
@keyframes copy-float {
    0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.7) rotate(-10deg);
    }
    15% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1) rotate(5deg);
    }
    100% {
        opacity: 0;
        transform: translate(-50%, calc(-50% - 28px)) scale(0.95) rotate(-3deg);
    }
}
@keyframes copy-sink {
    0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.7) rotate(10deg);
    }
    15% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1) rotate(-5deg);
    }
    100% {
        opacity: 0;
        transform: translate(-50%, calc(-50% + 28px)) scale(0.95) rotate(3deg);
    }
}
.copy-toast.show.down {
    animation-name: copy-sink;
}
#inquiry-commit {
    cursor: pointer;
    font-family: monospace;
}
#inquiry-commit:hover {
    color: var(--acc);
}
@media (prefers-reduced-motion: reduce) {
    .copy-toast.show {
        animation: none;
        opacity: 1;
        transform: translate(-50%, -50%);
    }
}
main.leaving {
    animation: fadeOut 0.18s cubic-bezier(0.4, 0, 1, 1) forwards;
}
@keyframes fadeOut {
    to { opacity: 0; transform: translateY(-10px) scale(0.985); }
}
.hint {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--sub);
    font-size: 0.95rem;
}
.hint:hover {
    color: var(--acc);
}
.hint kbd {
    font-family: monospace;
    font-size: 0.8rem;
    line-height: 1;
    padding: 3px 6px;
    border: 1px solid var(--sub);
    border-radius: 5px;
    transition: border-color 0.2s ease, color 0.2s ease;
}
.hint:hover kbd, main.leaving .hint kbd {
    border-color: var(--acc);
    color: var(--acc);
}
main.leaving .hint {
    color: var(--acc);
}
@media (prefers-reduced-motion: reduce) {
    main, main.leaving {
        animation: none;
        opacity: 1;
        transform: none;
    }
}
</style>
</head>
<body>
<main>
    <header>
        <h1>404</h1>
        <span class="dot-slot"><span class="dot" aria-hidden="true"></span></span>
        <span id="version" style="font-size: 0.8rem; color: var(--sub); opacity: 0.6; font-family: monospace; cursor: pointer; padding: 4px;" title="Checking version..."></span>
        <button id="theme-toggle" aria-label="Toggle theme" style="margin-left: auto; background: none; border: none; cursor: pointer; color: var(--sub); padding: 8px; display: flex;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path class="sun" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l.707-.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                <path class="moon" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" style="display: none;"></path>
            </svg>
        </button>
    </header>

    <section class="message">
        <h2>Page not found</h2>
        <p>That route doesn’t exist.</p>
        <a class="hint" href="/">Click anywhere or press <kbd>any key</kbd> to return home</a>
    </section>

    <footer>
        <span>For any inquiries, please email <a id="inquiry-email" href="mailto:2nikhilg@gmail.com">2nikhilg@gmail.com</a> with [<span id="inquiry-commit">...</span>] in the subject line.</span>
    </footer>
</main>

<span id="copy-toast" class="copy-toast" role="status" aria-live="polite" aria-label="Copied">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="5" y="4" width="14" height="17" rx="2"></rect>
        <path d="M9 4V3h6v1"></path>
    </svg>
</span>

<script>
// Theme Toggle
const toggle = document.getElementById('theme-toggle');
const sun = toggle.querySelector('.sun');
const moon = toggle.querySelector('.moon');
const root = document.documentElement;

const setTheme = (theme) => {
    root.setAttribute('data-theme', theme);
    localStorage.setItem('theme', theme);

    if (theme === 'dark') {
        sun.style.display = 'block';
        moon.style.display = 'none';
    } else {
        sun.style.display = 'none';
        moon.style.display = 'block';
    }
};

const saved = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
setTheme(saved);

toggle.onclick = () => {
    const current = root.getAttribute('data-theme');
    setTheme(current === 'dark' ? 'light' : 'dark');
};

const inquiryEmail = document.getElementById('inquiry-email');
const version = document.getElementById('version');
const copyToast = document.getElementById('copy-toast');
let copyToastTimer;
const inquiryCommitEl = document.getElementById('inquiry-commit');
const showCopyToast = (event, message, target, direction = 'up') => {
    const rect = target.getBoundingClientRect();
    const hasPointer = event.detail > 0 || event.clientX !== 0 || event.clientY !== 0;
    const x = hasPointer ? event.clientX : rect.left + rect.width / 2;
    const y = hasPointer ? event.clientY : rect.top + rect.height / 2;
    copyToast.setAttribute('aria-label', message);
    copyToast.style.left = `${x}px`;
    copyToast.style.top = `${y}px`;
    copyToast.classList.remove('show');
    copyToast.classList.toggle('down', direction === 'down');
    void copyToast.offsetWidth;
    copyToast.classList.add('show');
    clearTimeout(copyToastTimer);
    copyToastTimer = setTimeout(() => copyToast.classList.remove('show'), 700);
};
const copyText = async (text, event, target, direction) => {
    try {
        await navigator.clipboard.writeText(text);
        showCopyToast(event, 'Copied', target, direction);
    } catch {
        showCopyToast(event, 'Copy failed', target, direction);
    }
};
inquiryEmail.addEventListener('click', (event) => {
    event.preventDefault();
    copyText(inquiryEmail.textContent.trim(), event, inquiryEmail);
});
inquiryCommitEl.addEventListener('click', (event) => {
    event.preventDefault();
    copyText(inquiryCommitEl.textContent.trim(), event, inquiryCommitEl, 'down');
});
version.addEventListener('click', (event) => {
    event.preventDefault();
    const commit = version.dataset.commit || version.textContent.split('→').pop().replace('↻', '').trim();
    copyText(commit, event, version);
});

const mainEl = document.querySelector('main');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
// The status dot falls with eased gravity, rolls along the footer rule, then drops off its edge.
const statusDot = document.querySelector('.dot');
const dotSlot = document.querySelector('.dot-slot');
const footerEl = document.querySelector('footer');
const dotRadius = 5;
const gravityPeak = 1600;      // px/s^2 once the fall is up to speed
const gravityRamp = 0.55;      // seconds to ease from rest into full gravity
// One shove, chosen once per load, then never again: everything else scales off it.
const rollVector = 14 + Math.random() * 46;   // px/s of initial rightward drift
const rollPush = rollVector * 2.4;            // px/s^2 keeping it rolling on a surface
const rollCreep = 34;                         // px/s the roll always decays toward
const rollFriction = rollPush / rollCreep;    // drag ∝ the shove, so the creep speed is fixed
let dotX = 0;
let dotY = 0;
let dotVX = 0;
let dotVY = 0;
let dotLastTime;
let dotFallTime = 0;
let dotDragging = false;
let dotPointerX = 0;
let dotPointerY = 0;
let dotDragTime = 0;
const placeDot = () => {
    statusDot.style.left = `${dotX - dotRadius}px`;
    statusDot.style.top = `${dotY - dotRadius}px`;
};
// Cubic ease-in: the descent starts gently and accelerates into real gravity.
const easeIntoGravity = (progress) => progress * progress * progress;
const dotWorld = () => {
    const card = mainEl.getBoundingClientRect();
    const footer = footerEl.getBoundingClientRect();
    return {
        left: card.left + dotRadius,
        right: card.right - dotRadius,
        top: card.top + dotRadius,
        ground: card.bottom - dotRadius,
        lineY: footer.top - dotRadius,
        lineLeft: footer.left,
        lineRight: footer.right
    };
};
// The rule is a floor only for a dot that is above it and within its span.
const floorFor = (world, x, y) => (
    x >= world.lineLeft && x <= world.lineRight && y <= world.lineY + 0.5 ? world.lineY : world.ground
);
let dotOnLedge = false;
const animateDot = (time) => {
    if (dotLastTime === undefined) dotLastTime = time;
    const dt = Math.min((time - dotLastTime) / 1000, 0.032);
    dotLastTime = time;
    if (!dotDragging) {
        const world = dotWorld();
        const floor = floorFor(world, dotX, dotY);
        const resting = dotVY === 0 && dotY >= floor - 0.5;
        if (resting) {
            dotY = floor;
            dotFallTime = 0;
            if (floor === world.lineY) {
                // Friction scales with the shove, so any roll bleeds down to the same
                // gentle creep before it reaches the end of the rule.
                dotVX += (rollPush - rollFriction * dotVX) * dt;
                dotOnLedge = true;
            } else {
                dotVX *= 0.97;            // settle once it reaches the page floor
                if (Math.abs(dotVX) < 4) dotVX = 0;
                dotOnLedge = false;
            }
        } else if (dotVY < 0) {
            dotVY += gravityPeak * dt;    // rising: full gravity, so arcs stay honest
            dotFallTime = 0;
            dotOnLedge = false;
        } else {
            if (dotOnLedge) {
                // Just rolled past the end of the rule: tip over the edge and start
                // the fall already part-way up the gravity ramp, so it drops off the
                // cliff instead of gliding straight through it.
                dotOnLedge = false;
                dotVY = 45;
                dotFallTime = gravityRamp * 0.55;
            }
            dotFallTime += dt;            // falling: ease from a gentle release into full gravity
            dotVY += gravityPeak * easeIntoGravity(Math.min(dotFallTime / gravityRamp, 1)) * dt;
        }
        const wasAbove = dotY <= world.lineY + 0.5;
        dotX += dotVX * dt;
        dotY += dotVY * dt;
        if (dotX < world.left || dotX > world.right) {
            dotX = Math.max(world.left, Math.min(world.right, dotX));
            dotVX *= -0.6;
        }
        if (dotY < world.top) {
            dotY = world.top;
            dotVY = Math.abs(dotVY) * 0.6;
        }
        // Swept test, so a fast fall cannot tunnel through the rule.
        const onSpan = dotX >= world.lineLeft && dotX <= world.lineRight;
        const landing = onSpan && wasAbove ? world.lineY : world.ground;
        if (dotVY > 0 && dotY >= landing) {
            dotY = landing;
            dotVY = Math.abs(dotVY) < 60 ? 0 : -dotVY * 0.55;
            dotFallTime = 0;
        }
    }
    placeDot();
    requestAnimationFrame(animateDot);
};
const startDot = () => {
    const rect = dotSlot.getBoundingClientRect();
    dotX = rect.left + rect.width / 2;
    dotY = rect.top + rect.height / 2;
    dotVX = rollVector;           // a small random shove, as if rolled off a ledge
    dotVY = 0;
    dotFallTime = 0;
    statusDot.remove();
    document.body.appendChild(statusDot);
    placeDot();
    requestAnimationFrame(animateDot);
};
statusDot.addEventListener('pointerdown', (event) => {
    if (reduceMotion.matches) return;
    event.preventDefault();
    dotDragging = true;
    dotPointerX = event.clientX;
    dotPointerY = event.clientY;
    dotDragTime = performance.now();
    dotVX = 0;
    dotVY = 0;
    statusDot.classList.add('dragging');
    statusDot.setPointerCapture(event.pointerId);
});
statusDot.addEventListener('pointermove', (event) => {
    if (!dotDragging) return;
    const now = performance.now();
    const dt = Math.max((now - dotDragTime) / 1000, 0.008);
    const dx = event.clientX - dotPointerX;
    const dy = event.clientY - dotPointerY;
    dotVX = dx / dt;
    dotVY = dy / dt;
    dotX += dx;
    dotY += dy;
    dotPointerX = event.clientX;
    dotPointerY = event.clientY;
    dotDragTime = now;
});
statusDot.addEventListener('pointerup', (event) => {
    dotDragging = false;
    dotVY = Math.max(dotVY, 0) * 0.2;   // released: ease into the same gentle-then-fast fall
    dotFallTime = 0;
    statusDot.classList.remove('dragging');
    statusDot.releasePointerCapture(event.pointerId);
});
if (!reduceMotion.matches) {
    setTimeout(startDot, 600);
}

// Click anywhere / press any key to return home.
let leaving = false;
const goHome = () => {
    if (leaving) return;
    leaving = true;
    if (reduceMotion.matches) {
        window.location.href = '/';
        return;
    }
    mainEl.classList.add('leaving');
    setTimeout(() => { window.location.href = '/'; }, 180);
};
document.addEventListener('click', (event) => {
    if (event.defaultPrevented || event.button !== 0) return;
    if (event.metaKey || event.ctrlKey || event.altKey || event.shiftKey) return;
    if (event.target.closest('a, button, #version, #inquiry-commit, .dot')) return;
    if (String(window.getSelection())) return;
    goHome();
});
document.addEventListener('keydown', (event) => {
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    if (event.key === 'Shift' || event.key === 'Tab' || event.key === 'Escape') return;
    if (event.key.startsWith('F') && event.key.length > 1) return;
    goHome();
});
document.querySelector('.hint').addEventListener('click', (event) => {
    event.preventDefault();
    goHome();
});
// Version Watcher
(async()=>{
    const el = document.getElementById('version');
    const dot = document.querySelector('.dot');
    const inquiryCommit = document.getElementById('inquiry-commit');
    const inquiryEmail = document.getElementById('inquiry-email');
    const setInquiryCommit = (commit) => {
        inquiryCommit.textContent = commit;
        inquiryEmail.href = 'mailto:2nikhilg@gmail.com?subject=' + encodeURIComponent('[' + commit + ']');
    };
    let localCommit = null;

    const check = async () => {
        try {
            const res = await fetch('/commit.json?t='+Date.now());
            if(!res.ok) return;
            const d = await res.json();
            const remote = d.commit.slice(0,7);
            setInquiryCommit(remote);

            if(!localCommit) {
                localCommit = remote;
                el.textContent = localCommit;
                el.title = d.message || '';
                el.onclick = () => window.location.href = `https://github.com/nikhi1g/nikhi1g.github.io/commit/${d.commit}`;
                sessionStorage.setItem('v', localCommit);
            } else if(localCommit !== remote) {
                el.innerHTML = `${localCommit}&rarr;${remote} <span style="font-size:12px">↻</span>`;
                el.onclick = (e) => {
                    e.preventDefault();
                    location.reload();
                };
                el.style.opacity = 1;
                el.style.color = '#f97316';
                dot.style.backgroundColor = '#f97316';
                dot.classList.add('pulse');
            }
        } catch(e){}
    };

    await check();
    setInterval(check, 30000);
    document.addEventListener('visibilitychange', () => {
        if(document.visibilityState === 'visible') check();
    });
})();
</script>
</body>
</html>
