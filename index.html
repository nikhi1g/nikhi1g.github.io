<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Nikhil Gupta - Developer Portfolio">
<title>Nikhil Gupta</title>
<link rel="dns-prefetch" href="https://github.com">
<link rel="dns-prefetch" href="https://www.linkedin.com">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%233b82f6%22/></svg>">
<style>
:root {
    /* GitHub Light (Default) */
    --bg: #ffffff;
    --fg: #24292f;
    --acc: #0969da;
    --sub: #57606a;
}
html[data-theme="dark"] {
    /* GitHub Dark Dimmed */
    --bg: #22272e;
    --fg: #adbac7;
    --acc: #539bf5;
    --sub: #768390;
}
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
    background-color: var(--bg);
    color: var(--fg);
    line-height: 1.6;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.4s ease, color 0.4s ease;
    font-size: 18px; /* Increased base size */
}
main {
    width: 100%;
    max-width: 600px;
    padding: 2.5rem;
    animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    opacity: 0;
    transform: translateY(12px);
    outline: 1px solid var(--sub);
    border-radius: 12px;
}
@media (max-width: 600px) {
    main {
        padding: 1.5rem;
        border-radius: 0;
        outline: none;
        max-width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }
    body {
        align-items: flex-start;
    }
}
@keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
}
header {
    margin-bottom: 3.5rem;
    display: flex;
    align-items: center; /* Changed from baseline to center for better icon alignment */
    gap: 16px;
    flex-wrap: wrap;
}
h1 {
    margin: 0;
    font-size: 2rem; /* Larger Title */
    font-weight: 700;
    letter-spacing: -0.03em;
}
.dot {
    width: 10px;
    height: 10px;
    background-color: var(--acc);
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
}
.pulse {
    animation: pulse 2s infinite;
}
@keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0.7); }
    70% { box-shadow: 0 0 0 10px rgba(249, 115, 22, 0); }
    100% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0); }
}
nav {
    display: flex;
    gap: 2rem;
    margin-bottom: 3.5rem;
    font-size: 1.15rem; /* Larger Nav */
}
section h2 {
    font-size: 1rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--sub);
    margin: 0 0 1.25rem 0;
    font-weight: 600;
}
ul {
    list-style: none;
    padding: 0;
    margin: 0;
}
li {
    margin-bottom: 1rem;
    font-size: 1.1rem;
}
a {
    color: inherit;
    text-decoration: none;
    position: relative;
    transition: color 0.2s ease;
    padding: 4px 0; /* Larger tap target */
}
a:hover {
    color: var(--acc);
}
/* Subtle underline animation */
nav a::after, li a::after {
    content: '';
    position: absolute;
    width: 100%;
    transform: scaleX(0);
    height: 2px; /* Thicker line */
    bottom: -2px;
    left: 0;
    background-color: var(--acc);
    transform-origin: bottom right;
    transition: transform 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}
nav a:hover::after, li a:hover::after {
    transform: scaleX(1);
    transform-origin: bottom left;
}
</style>
</head>
<body>
<main>
    <header>
        <h1>Nikhil Gupta</h1>
        <span class="dot"></span>
        <span id="version" style="font-size: 0.8rem; color: var(--sub); opacity: 0.6; font-family: monospace; cursor: pointer; padding: 4px;" title="Checking version..."></span>
        <button id="theme-toggle" aria-label="Toggle theme" style="margin-left: auto; background: none; border: none; cursor: pointer; color: var(--sub); padding: 8px; display: flex;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path class="sun" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                <path class="moon" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" style="display: none;"></path>
            </svg>
        </button>
    </header>
    
    <nav>
        <a href="https://github.com/nikhi1g?tab=repositories">GitHub</a>
        <a href="https://www.linkedin.com/in/nikhil---gupta/">LinkedIn</a>
    </nav>

    <section>
        <ul>
            <li><a href="https://nikhi1g.github.io/mcat/index.html">MCAT</a></li>
            <li><a href="https://nikhi1g.github.io/153b/">153B</a></li>
        </ul>
    </section>
</main>

<script>
// Theme Toggle
const toggle = document.getElementById('theme-toggle');
const sun = toggle.querySelector('.sun');
const moon = toggle.querySelector('.moon');
const root = document.documentElement;

const setTheme = (theme) => {
    root.setAttribute('data-theme', theme);
    localStorage.setItem('theme', theme);
    
    // Logic: If Dark, show Sun (to switch to Light). If Light, show Moon (to switch to Dark).
    if (theme === 'dark') {
        sun.style.display = 'block';
        moon.style.display = 'none';
    } else {
        sun.style.display = 'none';
        moon.style.display = 'block';
    }
};

// Init
const saved = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
setTheme(saved);

toggle.onclick = () => {
    const current = root.getAttribute('data-theme');
    setTheme(current === 'dark' ? 'light' : 'dark');
};

// Version Watcher
(async()=>{
    const el = document.getElementById('version');
    const dot = document.querySelector('.dot');
    let localCommit = null;

    const check = async () => {
        try {
            const res = await fetch('commit.json?t='+Date.now());
            if(!res.ok) return;
            const d = await res.json();
            const remote = d.commit.slice(0,7);

            if(!localCommit) {
                // First load
                localCommit = remote;
                el.textContent = localCommit;
                el.title = d.message || '';
                sessionStorage.setItem('v', localCommit);
            } else if(localCommit !== remote) {
                // Update detected
                el.innerHTML = `${localCommit}&rarr;${remote} <span style="font-size:12px">↻</span>`;
                el.onclick = (e) => {
                    e.preventDefault();
                    location.reload();
                };
                el.style.opacity = 1;
                el.style.color = '#f97316'; // Orange text
                dot.style.backgroundColor = '#f97316'; // Orange dot
                dot.classList.add('pulse'); // Optional: add pulse if we had css
            }
        } catch(e){}
    };

    await check();
    setInterval(check, 30000); // Poll every 30s
    document.addEventListener('visibilitychange', () => {
        if(document.visibilityState === 'visible') check();
    });
})();
</script>
</body>
</html>
