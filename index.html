<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nikhil Gupta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Nikhil Gupta</h1>
        
        <nav>
            <a href="https://github.com/nikhi1g?tab=repositories" data-fighter="github">GitHub</a>
            <a href="https://www.linkedin.com/in/nikhil---gupta/" data-fighter="linkedin">LinkedIn</a>
        </nav>

        <section>
            <h2>Projects</h2>
            <ul>
                <li><a href="https://nikhi1g.github.io/aminoacids/index.html" data-fighter="amino">Amino Acids</a></li>
                <li><a href="https://nikhi1g.github.io/SpotifyAdSkipper/" data-fighter="spotify">Spotify Ad Skipper</a></li>
                <li><a href="https://2022mechatronicsnikhilgupta.weebly.com/" data-fighter="mech">Mechatronics Portfolio</a></li>
            </ul>
        </section>
    </main>

    <div id="ground"></div>

    <!-- Arena for blob + link fighters -->
    <div id="blob-container"></div>

    <!-- SVG sprite sheet for all fighters -->
    <svg id="fighter-sprites"
         xmlns="http://www.w3.org/2000/svg"
         xmlns:xlink="http://www.w3.org/1999/xlink"
         style="display:none">
        <!-- Default orange blob -->
        <symbol id="icon-blob" viewBox="0 0 80 80">
            <defs>
                <radialGradient id="blob-grad" cx="30%" cy="20%" r="70%">
                    <stop offset="0%" stop-color="#ffd39b"/>
                    <stop offset="100%" stop-color="#ff9f43"/>
                </radialGradient>
            </defs>
            <circle cx="40" cy="40" r="30" fill="url(#blob-grad)"/>
            <!-- Eyes -->
            <circle cx="30" cy="32" r="7" fill="#fff"/>
            <circle cx="50" cy="32" r="7" fill="#fff"/>
            <circle cx="30" cy="32" r="3" fill="#000"/>
            <circle cx="50" cy="32" r="3" fill="#000"/>
            <!-- Smile -->
            <path d="M26 48 Q40 60 54 48" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/>
        </symbol>

        <!-- GitHub fighter -->
        <symbol id="icon-github" viewBox="0 0 80 80">
            <circle cx="40" cy="40" r="30" fill="#111"/>
            <text x="40" y="47"
                  text-anchor="middle"
                  font-family="system-ui, -apple-system, sans-serif"
                  font-size="22"
                  fill="#fff"
                  font-weight="700">GH</text>
        </symbol>

        <!-- LinkedIn fighter -->
        <symbol id="icon-linkedin" viewBox="0 0 80 80">
            <rect x="10" y="10" width="60" height="60" rx="12" fill="#0a66c2"/>
            <text x="40" y="50"
                  text-anchor="middle"
                  font-family="system-ui, -apple-system, sans-serif"
                  font-size="28"
                  fill="#fff"
                  font-weight="700">in</text>
        </symbol>

        <!-- Amino Acids fighter -->
        <symbol id="icon-amino" viewBox="0 0 80 80">
            <circle cx="40" cy="40" r="30" fill="#7e57c2"/>
            <text x="40" y="46"
                  text-anchor="middle"
                  font-family="system-ui, -apple-system, sans-serif"
                  font-size="20"
                  fill="#fff"
                  font-weight="700">AA</text>
        </symbol>

        <!-- Spotify fighter -->
        <symbol id="icon-spotify" viewBox="0 0 80 80">
            <circle cx="40" cy="40" r="30" fill="#1db954"/>
            <path d="M26 36 C36 33 44 33 54 37"
                  stroke="#0b1f15" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M27 43 C35 41 45 41 53 45"
                  stroke="#0b1f15" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M28 50 C36 49 42 49 52 52"
                  stroke="#0b1f15" stroke-width="3" fill="none" stroke-linecap="round"/>
        </symbol>

        <!-- Mechatronics fighter -->
        <symbol id="icon-mech" viewBox="0 0 80 80">
            <circle cx="40" cy="40" r="30" fill="#455a64"/>
            <circle cx="40" cy="40" r="14" fill="#eceff1"/>
            <circle cx="40" cy="40" r="6" fill="#455a64"/>
            <text x="40" y="20"
                  text-anchor="middle"
                  font-family="system-ui, -apple-system, sans-serif"
                  font-size="12"
                  fill="#eceff1"
                  font-weight="600">MECH</text>
        </symbol>
    </svg>

    <div id="version-sensor" class="sensor-loading">
        <span class="sensor-icon">●</span>
        <span class="sensor-text">Connecting...</span>
    </div>

    <script>
        // -------- FIGHTER ARENA + PHYSICS --------
        const arena = document.getElementById('blob-container');
        const GROUND_PAD = 20;
        const GRAVITY = 0.55;
        const BASE_RIGHT_OFFSET = 150;

        let groundY = window.innerHeight - 100 - GROUND_PAD;
        let animationRunning = false;
        let hasSpawnedOnce = false;
        let activeHoverId = null;

        const fighters = {};

        function makeFighter(id, spriteId, sideOffset) {
            const el = document.createElement('div');
            el.className = 'fighter';
            el.dataset.id = id;
            el.innerHTML = `
                <svg class="fighter-svg" viewBox="0 0 80 80" aria-hidden="true">
                    <use href="#\${spriteId}" xlink:href="#\${spriteId}"></use>
                </svg>
            `;
            arena.appendChild(el);

            fighters[id] = {
                id,
                spriteId,
                el,
                state: 'waiting',
                x: window.innerWidth - BASE_RIGHT_OFFSET + sideOffset,
                y: -200,
                vy: 0,
                scaleX: 1,
                scaleY: 1,
                energy: id === 'blob' ? 1 : 0,
                sideOffset
            };
        }

        function spawnFighter(id) {
            const f = fighters[id];
            if (!f) return;
            f.state = 'falling';
            f.y = -200;
            f.vy = 0;
            f.scaleX = 1;
            f.scaleY = 1;
            f.el.classList.add('visible');
        }

        function startAnimationLoop() {
            if (animationRunning) return;
            animationRunning = true;
            requestAnimationFrame(step);
        }

        function step() {
            const ids = Object.keys(fighters);
            ids.forEach(id => {
                const f = fighters[id];
                if (f.state === 'waiting' || f.state === 'dead') return;

                // Basic falling + squish
                if (f.state === 'falling') {
                    f.vy += GRAVITY;
                    f.y += f.vy;

                    const stretch = Math.min(1.6, 1 + Math.abs(f.vy) * 0.025);
                    f.scaleY = stretch;
                    f.scaleX = 1 / stretch;

                    if (f.y >= groundY) {
                        f.y = groundY;
                        f.vy = 0;
                        f.state = 'idle';
                        f.scaleX = 1.15;
                        f.scaleY = 0.85;
                    }
                } else if (f.state === 'idle') {
                    // Relax scales back to 1
                    f.scaleX += (1 - f.scaleX) * 0.12;
                    f.scaleY += (1 - f.scaleY) * 0.12;
                }

                // Energy logic: hover makes that fighter win, otherwise it decays
                // Modified to ensure Blob loses energy when Fighting
                if (id === 'blob') {
                    if (!activeHoverId) {
                         f.energy = Math.min(1, f.energy + 0.015);
                    } else {
                         // Blob loses energy if someone else is fighting
                         f.energy = Math.max(0, f.energy - 0.02); 
                    }
                } else if (id === activeHoverId) {
                    f.energy = Math.min(1, f.energy + 0.03);
                } else {
                    f.energy = Math.max(0, f.energy - 0.02);
                }

                // If hovered fighter is strong, blob fades out (is defeated)
                if (id === 'blob' &&
                    activeHoverId &&
                    fighters[activeHoverId] &&
                    fighters[activeHoverId].energy > 0.8 &&
                    f.energy < 0.25) {
                    f.state = 'dead';
                    f.el.classList.remove('visible');
                }

                // When no hover, non-blob fighters slowly die off
                if (!activeHoverId && id !== 'blob' && f.energy <= 0.02) {
                    f.state = 'dead';
                    f.el.classList.remove('visible');
                }

                // When no hover and blob is dead, respawn blob
                if (!activeHoverId && id === 'blob' && f.state === 'dead') {
                    spawnFighter('blob');
                    f.energy = 0.1; // Start low so it fades in
                }

                // Opacity: more energy -> more visible
                const baseOpacity = id === 'blob' && !activeHoverId ? 1 : 0.25;
                const extra = f.energy * 0.75;
                const alpha = Math.max(0, Math.min(1, baseOpacity + extra));
                f.el.style.opacity = alpha;

                // Apply transform
                f.el.style.transform =
                    `translate3d(\${f.x}px, \${f.y}px, 0) scale(\${f.scaleX}, \${f.scaleY})`;
            });

            if (animationRunning) {
                requestAnimationFrame(step);
            }
        }

        // Create fighters: blob on the right, others slightly to the left
        makeFighter('blob', 'icon-blob', 0);
        makeFighter('github', 'icon-github', -110);
        makeFighter('linkedin', 'icon-linkedin', -110);
        makeFighter('amino', 'icon-amino', -110);
        makeFighter('spotify', 'icon-spotify', -110);
        makeFighter('mech', 'icon-mech', -110);

        // First mouse move spawns blob and starts animation
        document.addEventListener('mousemove', () => {
            if (!hasSpawnedOnce) {
                hasSpawnedOnce = true;
                spawnFighter('blob');
                startAnimationLoop();
            }
        }, { once: true });

        // Hover events for links
        document.querySelectorAll('a[data-fighter]').forEach(link => {
            const id = link.dataset.fighter;
            link.addEventListener('mouseenter', () => {
                activeHoverId = id;
                const f = fighters[id];
                if (!f) return;
                if (f.state === 'waiting' || f.state === 'dead') {
                    // Re-position slightly left of blob each time we spawn
                    f.x = window.innerWidth - BASE_RIGHT_OFFSET - 80; // Overlap for fight
                    spawnFighter(id);
                    f.energy = Math.max(f.energy, 0.3);
                }
            });
            link.addEventListener('mouseleave', () => {
                if (activeHoverId === id) {
                    activeHoverId = null;
                }
            });
        });

        // Keep ground / arena aligned on resize
        window.addEventListener('resize', () => {
            groundY = window.innerHeight - 100 - GROUND_PAD;
            Object.values(fighters).forEach(f => {
                // Keep relative offsets
                f.x = window.innerWidth - BASE_RIGHT_OFFSET + f.sideOffset;
                if (f.state === 'idle' || f.state === 'dead') {
                    f.y = groundY;
                }
            });
        });

        // -------- Version Sensor Script (unchanged) --------
        (function() {
            const REPO = 'nikhi1g/nikhi1g.github.io';
            const BRANCH = 'main';
            const SENSOR_EL = document.getElementById('version-sensor');
            const TEXT_EL = SENSOR_EL.querySelector('.sensor-text');
            const POLL_INTERVAL = 60000;

            let currentHash = null;

            async function fetchLatestCommit() {
                try {
                    const response = await fetch(`https://api.github.com/repos/\${REPO}/commits/\${BRANCH}`);
                    if (!response.ok) throw new Error('API Error');
                    const data = await response.json();
                    return {
                        hash: data.sha.substring(0, 7),
                        msg: data.commit.message
                    };
                } catch (error) { return null; }
            }

            async function initSensor() {
                const commit = await fetchLatestCommit();
                if (commit) {
                    currentHash = commit.hash;
                    SENSOR_EL.classList.remove('sensor-loading');
                    SENSOR_EL.classList.add('sensor-active');
                    TEXT_EL.textContent = `v: \${currentHash}`;
                } else {
                    TEXT_EL.textContent = 'Offline';
                }
            }

            async function checkForUpdates() {
                if (!currentHash) return;
                const latest = await fetchLatestCommit();
                if (latest && latest.hash !== currentHash) {
                    SENSOR_EL.classList.add('sensor-update');
                    TEXT_EL.innerHTML = `
                        <span class="old-version">(\${currentHash})</span> 
                        <span class="arrow">→</span> 
                        <span class="new-version">(\${latest.hash})</span>
                        <span class="update-msg">New: \${latest.msg}</span>
                    `;
                    // Check if button already exists to avoid duplicates
                    if (!SENSOR_EL.querySelector('.sensor-reload-btn')) {
                        const btn = document.createElement('button');
                        btn.className = 'sensor-reload-btn';
                        btn.onclick = () => window.location.reload();
                        btn.textContent = 'Reload';
                        SENSOR_EL.appendChild(btn);
                    }
                }
            }
            initSensor();
            setInterval(checkForUpdates, POLL_INTERVAL);
        })();
    </script>
</body>
</html>
