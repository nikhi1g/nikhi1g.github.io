<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nikhil Gupta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Nikhil Gupta</h1>
        <p>Developer & Creator</p>
        
        <nav>
            <a href="https://github.com/nikhi1g?tab=repositories">GitHub</a>
            <a href="https://www.linkedin.com/in/nikhil---gupta/">LinkedIn</a>
        </nav>

        <section>
            <h2>Projects</h2>
            <ul>
                <li><a href="https://nikhi1g.github.io/aminoacids/index.html">Amino Acids</a></li>
                <li><a href="https://nikhi1g.github.io/SpotifyAdSkipper/">Spotify Ad Skipper</a></li>
                <li><a href="https://2022mechatronicsnikhilgupta.weebly.com/">Mechatronics Portfolio</a></li>
            </ul>
        </section>
    </main>
    <div id="blob-container">
        <div class="speech-bubble">Gimme your cursor!</div>
        <div class="blob">
            <div class="eye" id="eye-left">
                <div class="pupil"></div>
            </div>
            <div class="eye" id="eye-right">
                <div class="pupil"></div>
            </div>
            <div class="mouth"></div>
            <div class="basketball"></div>
        </div>
    </div>

    <div id="version-sensor" class="sensor-loading">
        <span class="sensor-icon">●</span>
        <span class="sensor-text">Connecting...</span>
    </div>

    <script>
        // Blob Animation Script
        const blobContainer = document.getElementById('blob-container');
        const speechBubble = document.querySelector('.speech-bubble');
        const basketball = document.querySelector('.basketball');
        let blobState = 'idle'; // idle, falling, recovering, active, begging, dunking, pointing

        function triggerBlobEntrance() {
            if (blobState !== 'idle') return;
            
            blobState = 'falling';
            blobContainer.classList.add('falling');

            setTimeout(() => {
                blobState = 'recovering';
                blobContainer.classList.remove('falling');
                blobContainer.classList.add('recovering');

                setTimeout(() => {
                    blobState = 'active';
                    blobContainer.classList.remove('recovering');
                    blobContainer.classList.add('active');
                    
                    // Start begging sequence shortly after activating
                    setTimeout(startBegging, 1000);
                }, 1500);
            }, 1000);
        }

        function startBegging() {
            blobState = 'begging';
            blobContainer.classList.remove('active');
            blobContainer.classList.add('begging');
            
            // Listen for interaction
            blobContainer.addEventListener('mouseenter', startDunkSequence, { once: true });
        }

        function startDunkSequence() {
            if (blobState !== 'begging') return;
            blobState = 'dunking';
            
            // 1. Visual Changes
            document.body.style.cursor = 'none'; // Hide cursor
            blobContainer.classList.remove('begging');
            blobContainer.classList.add('dunking');
            speechBubble.style.opacity = '0';
            basketball.style.display = 'block'; // Show ball

            // 2. Identify Target Link
            const links = document.querySelectorAll('main ul li a');
            if (links.length === 0) return; // Fail safe
            const targetLink = links[Math.floor(Math.random() * links.length)];
            
            // 3. Create Hoop
            const hoop = document.createElement('div');
            hoop.className = 'hoop-container';
            hoop.innerHTML = `
                <div class="hoop-backboard"></div>
                <div class="hoop-rim"></div>
                <div class="hoop-net"></div>
            `;
            targetLink.parentElement.style.position = 'relative'; // Ensure positioning relative to LI
            targetLink.parentElement.appendChild(hoop);
            
            // Trigger reflow/animation
            requestAnimationFrame(() => hoop.classList.add('show-hoop'));

            // 4. Calculate Positions
            const blobRect = blobContainer.getBoundingClientRect();
            const hoopRect = hoop.getBoundingClientRect();
            const linkRect = targetLink.getBoundingClientRect();

            // Calculate translation needed to get to hoop
            // Position relative to viewport, but we need to move the fixed element
            const deltaX = (hoopRect.left - blobRect.left) - 60; // Offset to be "dunking" position
            const deltaY = (hoopRect.top - blobRect.top) - 50;

            // 5. Animate to Hoop
            // Use transform directly for movement
            blobContainer.style.transition = 'transform 1s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
            blobContainer.style.transform = `translate(${deltaX}px, ${deltaY}px) scale(1.2)`;

            // 6. Dunk Action (at end of movement)
            setTimeout(() => {
                // Ball goes through hoop animation could go here
                
                // 7. Celebrate & Highlight
                blobContainer.classList.add('celebrating');
                
                setTimeout(() => {
                    // 8. Move to resting pointing position (next to link)
                    const pointX = deltaX - 50; // Move slightly left of hoop
                    const pointY = deltaY + 50; // Move down
                    
                    blobContainer.style.transform = `translate(${pointX}px, ${pointY}px) scale(0.8)`;
                    blobContainer.classList.remove('dunking', 'celebrating');
                    blobContainer.classList.add('pointing');
                    
                    // Highlight Link
                    targetLink.classList.add('link-highlight');
                    
                    // Show cursor again
                    document.body.style.cursor = 'auto';
                    
                }, 1000); // Celebration duration
            }, 1000); // Movement duration
        }

        document.addEventListener('mousemove', (e) => {
            if (blobState === 'idle') {
                triggerBlobEntrance();
            }

            // Track eyes (only when active or begging)
            if (['active', 'begging', 'pointing'].includes(blobState)) {
                const eyes = document.querySelectorAll('.eye');
                eyes.forEach(eye => {
                    const pupil = eye.querySelector('.pupil');
                    const rect = eye.getBoundingClientRect();
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;
                    const angle = Math.atan2(e.clientY - centerY, e.clientX - centerX);
                    const distance = Math.min(3, Math.hypot(e.clientX - centerX, e.clientY - centerY) / 10);
                    pupil.style.transform = `translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance}px)`;
                });
            }
        });

        // Version Sensor Script
        (function() {
            const REPO = 'nikhi1g/nikhi1g.github.io';
            const BRANCH = 'main';
            const SENSOR_EL = document.getElementById('version-sensor');
            const TEXT_EL = SENSOR_EL.querySelector('.sensor-text');
            const POLL_INTERVAL = 60000; // 60 seconds

            let currentHash = null;
            let currentMsg = null;

            async function fetchLatestCommit() {
                try {
                    const response = await fetch(`https://api.github.com/repos/${REPO}/commits/${BRANCH}`);
                    if (!response.ok) throw new Error('API Error');
                    const data = await response.json();
                    return {
                        hash: data.sha.substring(0, 7),
                        msg: data.commit.message,
                        fullHash: data.sha
                    };
                } catch (error) {
                    console.error('Sensor error:', error);
                    return null;
                }
            }

            async function initSensor() {
                const commit = await fetchLatestCommit();
                if (commit) {
                    currentHash = commit.hash;
                    currentMsg = commit.msg;
                    SENSOR_EL.classList.remove('sensor-loading');
                    SENSOR_EL.classList.add('sensor-active');
                    TEXT_EL.textContent = `v: ${currentHash}`;
                    TEXT_EL.title = currentMsg;
                } else {
                    TEXT_EL.textContent = 'Offline';
                }
            }

            async function checkForUpdates() {
                if (!currentHash) return;
                
                const latest = await fetchLatestCommit();
                if (latest && latest.hash !== currentHash) {
                    SENSOR_EL.classList.add('sensor-update');
                    // Format: (hash123) (msg) --> (hash456) (msg)
                    TEXT_EL.innerHTML = `
                        <span class="old-version">(${currentHash})</span> 
                        <span class="arrow">→</span> 
                        <span class="new-version">(${latest.hash})</span>
                        <span class="update-msg">New: ${latest.msg}</span>
                    `;
                }
            }

            initSensor();
            setInterval(checkForUpdates, POLL_INTERVAL);
        })();
    </script>
</body>
</html>
