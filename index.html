<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nikhil Gupta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Nikhil Gupta</h1>
        <p>Developer & Creator</p>
        
        <nav>
            <a href="https://github.com/nikhi1g?tab=repositories">GitHub</a>
            <a href="https://www.linkedin.com/in/nikhil---gupta/">LinkedIn</a>
        </nav>

        <section>
            <h2>Projects</h2>
            <ul>
                <li><a href="https://nikhi1g.github.io/aminoacids/index.html">Amino Acids</a></li>
                <li><a href="https://nikhi1g.github.io/SpotifyAdSkipper/">Spotify Ad Skipper</a></li>
                <li><a href="https://2022mechatronicsnikhilgupta.weebly.com/">Mechatronics Portfolio</a></li>
            </ul>
        </section>
    </main>
    <div id="blob-container">
        <div class="blob">
            <div class="eye" id="eye-left">
                <div class="pupil"></div>
            </div>
            <div class="eye" id="eye-right">
                <div class="pupil"></div>
            </div>
            <div class="mouth"></div>
        </div>
    </div>

    <div id="version-sensor" class="sensor-loading">
        <span class="sensor-icon">●</span>
        <span class="sensor-text">Connecting...</span>
    </div>

    <script>
        // Blob Animation Script
        document.addEventListener('mousemove', (e) => {
            const eyes = document.querySelectorAll('.eye');
            
            eyes.forEach(eye => {
                const pupil = eye.querySelector('.pupil');
                const rect = eye.getBoundingClientRect();
                const eyeCenterX = rect.left + rect.width / 2;
                const eyeCenterY = rect.top + rect.height / 2;
                
                const angle = Math.atan2(e.clientY - eyeCenterY, e.clientX - eyeCenterX);
                const distance = Math.min(3, Math.hypot(e.clientX - eyeCenterX, e.clientY - eyeCenterY) / 10);
                
                const pupilX = Math.cos(angle) * distance;
                const pupilY = Math.sin(angle) * distance;
                
                pupil.style.transform = `translate(${pupilX}px, ${pupilY}px)`;
            });
        });

        // Version Sensor Script
        (function() {
            const REPO = 'nikhi1g/nikhi1g.github.io';
            const BRANCH = 'main';
            const SENSOR_EL = document.getElementById('version-sensor');
            const TEXT_EL = SENSOR_EL.querySelector('.sensor-text');
            const POLL_INTERVAL = 60000; // 60 seconds

            let currentHash = null;
            let currentMsg = null;

            async function fetchLatestCommit() {
                try {
                    const response = await fetch(`https://api.github.com/repos/${REPO}/commits/${BRANCH}`);
                    if (!response.ok) throw new Error('API Error');
                    const data = await response.json();
                    return {
                        hash: data.sha.substring(0, 7),
                        msg: data.commit.message,
                        fullHash: data.sha
                    };
                } catch (error) {
                    console.error('Sensor error:', error);
                    return null;
                }
            }

            async function initSensor() {
                const commit = await fetchLatestCommit();
                if (commit) {
                    currentHash = commit.hash;
                    currentMsg = commit.msg;
                    SENSOR_EL.classList.remove('sensor-loading');
                    SENSOR_EL.classList.add('sensor-active');
                    TEXT_EL.textContent = `v: ${currentHash}`;
                    TEXT_EL.title = currentMsg;
                } else {
                    TEXT_EL.textContent = 'Offline';
                }
            }

            async function checkForUpdates() {
                if (!currentHash) return;
                
                const latest = await fetchLatestCommit();
                if (latest && latest.hash !== currentHash) {
                    SENSOR_EL.classList.add('sensor-update');
                    // Format: (hash123) (msg) --> (hash456) (msg)
                    TEXT_EL.innerHTML = `
                        <span class="old-version">(${currentHash})</span> 
                        <span class="arrow">→</span> 
                        <span class="new-version">(${latest.hash})</span>
                        <span class="update-msg">New: ${latest.msg}</span>
                    `;
                }
            }

            initSensor();
            setInterval(checkForUpdates, POLL_INTERVAL);
        })();
    </script>
</body>
</html>
