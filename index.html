<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nikhil Gupta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Nikhil Gupta</h1>
        
        <nav>
            <a href="https://github.com/nikhi1g?tab=repositories" data-type="github" data-emoji="🐱">GitHub</a>
            <a href="https://www.linkedin.com/in/nikhil---gupta/" data-type="linkedin" data-emoji="💼">LinkedIn</a>
        </nav>

        <section>
            <h2>Projects</h2>
            <ul>
                <li><a href="https://nikhi1g.github.io/aminoacids/index.html" data-type="amino" data-emoji="🧬">Amino Acids</a></li>
                <li><a href="https://nikhi1g.github.io/SpotifyAdSkipper/" data-type="spotify" data-emoji="🎵">Spotify Ad Skipper</a></li>
                <li><a href="https://2022mechatronicsnikhilgupta.weebly.com/" data-type="robot" data-emoji="🤖">Mechatronics Portfolio</a></li>
            </ul>
        </section>
    </main>

    <div id="ground"></div>

    <!-- Template for Mascots -->
    <template id="mascot-template">
        <div class="mascot-container">
            <div class="blob">
                <!-- Face for default -->
                <div class="eye" id="eye-left"><div class="pupil"></div></div>
                <div class="eye" id="eye-right"><div class="pupil"></div></div>
                <div class="mouth"></div>
                <!-- Emoji container -->
                <div class="blob-emoji"></div>
            </div>
        </div>
    </template>

    <div id="version-sensor" class="sensor-loading">
        <span class="sensor-icon">●</span>
        <span class="sensor-text">Connecting...</span>
    </div>

    <script>
        // --- Mascot System ---
        const groundElement = document.getElementById('ground');
        const mascotTemplate = document.getElementById('mascot-template');
        const GROUND_PAD = 20;
        const GRAVITY = 0.6;
        
        let groundY = window.innerHeight - 100 - GROUND_PAD;
        window.addEventListener('resize', () => {
            groundY = window.innerHeight - 100 - GROUND_PAD;
        });

        class Mascot {
            constructor(type, emoji = null) {
                this.type = type;
                this.element = mascotTemplate.content.cloneNode(true).querySelector('.mascot-container');
                this.blob = this.element.querySelector('.blob');
                document.body.appendChild(this.element);

                // Setup Appearance
                if (type !== 'default') {
                    this.blob.classList.add(type, 'has-emoji');
                    this.blob.querySelector('.blob-emoji').textContent = emoji;
                }

                // Physics State
                this.state = 'falling';
                this.pos = { x: window.innerWidth - 150, y: -200 }; // Start above
                this.vel = { x: 0, y: 0 };
                this.scale = { x: 1, y: 1 };
                this.spring = { target: { x: 1, y: 1 }, stiffness: 0.05, damping: 0.90, vel: { x: 0, y: 0 } };
                this.active = true;

                // Make visible immediately
                requestAnimationFrame(() => this.element.classList.add('visible'));
            }

            update(targetY, otherMascot) {
                if (!this.active) return;

                // 1. Position Physics
                if (this.state === 'falling') {
                    this.vel.y += GRAVITY;
                    this.pos.y += this.vel.y;

                    // Stretch
                    const stretch = Math.min(1.6, 1 + (Math.abs(this.vel.y) * 0.025));
                    this.scale.y = stretch;
                    this.scale.x = 1 / stretch;

                    // Collision with Other Mascot (The Fight)
                    if (otherMascot && otherMascot.state === 'idle' && this.pos.y + 100 >= otherMascot.pos.y + 20) {
                        // HIT!
                        this.pos.y = otherMascot.pos.y - 50; // Land slightly inside/on top
                        this.vel.y = 0;
                        this.state = 'slumped';
                        this.triggerImpact();
                        return 'hit_mascot'; // Signal manager to kill other
                    }

                    // Collision with Ground
                    if (this.pos.y >= groundY) {
                        this.pos.y = groundY;
                        this.vel.y = 0;
                        this.state = 'slumped';
                        this.triggerImpact();
                        return 'hit_ground';
                    }
                }

                // 2. Spring Physics
                if (this.state === 'recovering' || this.state === 'idle' || this.state === 'slumped') {
                    const forceX = (this.spring.target.x - this.scale.x) * this.spring.stiffness;
                    const forceY = (this.spring.target.y - this.scale.y) * this.spring.stiffness;
                    this.spring.vel.x += forceX;
                    this.spring.vel.y += forceY;
                    this.spring.vel.x *= this.spring.damping;
                    this.spring.vel.y *= this.spring.damping;
                    this.scale.x += this.spring.vel.x;
                    this.scale.y += this.spring.vel.y;

                    if (this.state === 'recovering' && Math.abs(this.spring.vel.y) < 0.001) {
                        this.state = 'idle';
                        if (this.type === 'default') {
                            this.blob.classList.add('happy');
                            this.blob.classList.remove('squished');
                        }
                    }
                }

                // Render
                this.element.style.transform = `translate3d(${this.pos.x}px, ${this.pos.y}px, 0)`;
                this.blob.style.transform = `scale(${this.scale.x}, ${this.scale.y})`;
                
                return null;
            }

            triggerImpact() {
                this.blob.classList.add('squished');
                this.scale.y = 0.25; this.scale.x = 2.2;
                this.spring.vel.y = -0.15; // Jiggle
                setTimeout(() => {
                    if (this.state === 'slumped') {
                        this.state = 'recovering';
                        if (this.type === 'default') this.blob.classList.remove('squished');
                    }
                }, 150);
            }

            die() {
                this.active = false;
                this.element.style.transition = 'transform 0.2s, opacity 0.2s';
                this.element.style.transform = `translate3d(${this.pos.x}px, ${this.pos.y + 50}px, 0) scale(2, 0.1)`; // Flat pancake
                this.element.style.opacity = '0';
                setTimeout(() => this.element.remove(), 200);
            }
            
            lookAt(mouseX, mouseY) {
                if (this.type !== 'default') return; // Only default has eyes
                const eyes = this.blob.querySelectorAll('.eye');
                eyes.forEach(eye => {
                    const pupil = eye.querySelector('.pupil');
                    const rect = eye.getBoundingClientRect();
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;
                    const angle = Math.atan2(mouseY - centerY, mouseX - centerX);
                    const distance = Math.min(3, Math.hypot(mouseX - centerX, mouseY - centerY) / 10);
                    pupil.style.transform = `translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance}px)`;
                });
            }
        }

        // --- Manager ---
        let currentMascot = null;
        let incomingMascot = null;
        let targetMascotType = 'default'; // The mascot we WANT to be showing
        let mouseX = 0, mouseY = 0;
        let hasStarted = false;

        function spawnMascot(type, emoji) {
            if (incomingMascot) return; // Busy falling
            if (currentMascot && currentMascot.type === type) return; // Already current

            incomingMascot = new Mascot(type, emoji);
        }

        function getEmojiForType(type) {
            const link = document.querySelector(`a[data-type="${type}"]`);
            return link ? link.getAttribute('data-emoji') : null;
        }

        function gameLoop() {
            // 1. Check for Pending Spawns (Eventual Consistency)
            // If we aren't busy, and the current mascot isn't what we want...
            if (hasStarted && !incomingMascot) {
                 if (!currentMascot || currentMascot.type !== targetMascotType) {
                     spawnMascot(targetMascotType, getEmojiForType(targetMascotType));
                 }
            }

            // 2. Update Incoming
            if (incomingMascot) {
                const result = incomingMascot.update(groundY, currentMascot);
                
                if (result === 'hit_mascot' || result === 'hit_ground') {
                    // Success replacement
                    if (currentMascot) currentMascot.die();
                    currentMascot = incomingMascot;
                    incomingMascot = null;
                }
            }

            // 3. Update Current
            if (currentMascot) {
                currentMascot.update(groundY, null);
                currentMascot.lookAt(mouseX, mouseY);
            }

            requestAnimationFrame(gameLoop);
        }

        gameLoop();

        // --- Events ---
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;

            if (!hasStarted) {
                hasStarted = true;
                // 'default' is already the initial targetMascotType
            }
        });

        // Link Hover Logic
        const links = document.querySelectorAll('a[data-type]');
        links.forEach(link => {
            link.addEventListener('mouseenter', () => {
                const type = link.getAttribute('data-type');
                targetMascotType = type;
            });

            link.addEventListener('mouseleave', () => {
                targetMascotType = 'default';
            });
        });

        // Resize Handling
        window.addEventListener('resize', () => {
            const newX = window.innerWidth - 150;
            if (currentMascot) currentMascot.pos.x = newX;
            if (incomingMascot) incomingMascot.pos.x = newX;
        });

        // Version Sensor Script
        (function() {
            const REPO = 'nikhi1g/nikhi1g.github.io';
            const BRANCH = 'main';
            const SENSOR_EL = document.getElementById('version-sensor');
            const TEXT_EL = SENSOR_EL.querySelector('.sensor-text');
            const POLL_INTERVAL = 60000;

            let currentHash = null;
            let currentMsg = null;

            async function fetchLatestCommit() {
                try {
                    const response = await fetch(`https://api.github.com/repos/${REPO}/commits/${BRANCH}`);
                    if (!response.ok) throw new Error('API Error');
                    const data = await response.json();
                    return {
                        hash: data.sha.substring(0, 7),
                        msg: data.commit.message
                    };
                } catch (error) { return null; }
            }

            async function initSensor() {
                const commit = await fetchLatestCommit();
                if (commit) {
                    currentHash = commit.hash;
                    SENSOR_EL.classList.remove('sensor-loading');
                    SENSOR_EL.classList.add('sensor-active');
                    TEXT_EL.textContent = `v: ${currentHash}`;
                } else {
                    TEXT_EL.textContent = 'Offline';
                }
            }

            async function checkForUpdates() {
                if (!currentHash) return;
                const latest = await fetchLatestCommit();
                if (latest && latest.hash !== currentHash) {
                    SENSOR_EL.classList.add('sensor-update');
                    // Update text only
                    TEXT_EL.innerHTML = `
                        <span class="old-version">(${currentHash})</span> 
                        <span class="arrow">→</span> 
                        <span class="new-version">(${latest.hash})</span>
                        <span class="update-msg">New: ${latest.msg}</span>
                    `;
                    // Check if button already exists to avoid duplicates
                    if (!SENSOR_EL.querySelector('.sensor-reload-btn')) {
                        const btn = document.createElement('button');
                        btn.className = 'sensor-reload-btn';
                        btn.onclick = () => window.location.reload();
                        btn.textContent = 'Reload';
                        SENSOR_EL.appendChild(btn);
                    }
                }
            }
            initSensor();
            setInterval(checkForUpdates, POLL_INTERVAL);
        })();
    </script>
</body>
</html>
