<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Nikhil Gupta - Developer Portfolio">
<title>Nikhil Gupta</title>
<link rel="dns-prefetch" href="https://github.com">
<link rel="dns-prefetch" href="https://www.linkedin.com">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%233b82f6%22/></svg>">
<style>
:root {
    /* GitHub Light (Default) */
    --bg: #ffffff;
    --fg: #24292f;
    --acc: #0969da;
    --sub: #57606a;
}
html[data-theme="dark"] {
    /* GitHub Dark Dimmed */
    --bg: #22272e;
    --fg: #adbac7;
    --acc: #539bf5;
    --sub: #768390;
}
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
    background-color: var(--bg);
    color: var(--fg);
    line-height: 1.6;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
}
main {
    width: 100%;
    max-width: 580px;
    padding: 2rem;
    animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    opacity: 0;
    transform: translateY(12px);
}
@keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
}
header {
    margin-bottom: 3rem;
    display: flex;
    align-items: baseline;
    gap: 12px;
}
h1 {
    margin: 0;
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: -0.02em;
}
.dot {
    width: 8px;
    height: 8px;
    background-color: var(--acc);
    border-radius: 50%;
    display: inline-block;
}
nav {
    display: flex;
    gap: 1.5rem;
    margin-bottom: 3rem;
    font-size: 0.95rem;
}
section h2 {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--sub);
    margin: 0 0 1rem 0;
    font-weight: 500;
}
ul {
    list-style: none;
    padding: 0;
    margin: 0;
}
li {
    margin-bottom: 0.75rem;
}
a {
    color: inherit;
    text-decoration: none;
    position: relative;
    transition: color 0.2s ease;
}
a:hover {
    color: var(--acc);
}
/* Subtle underline animation */
nav a::after, li a::after {
    content: '';
    position: absolute;
    width: 100%;
    transform: scaleX(0);
    height: 1px;
    bottom: -2px;
    left: 0;
    background-color: var(--acc);
    transform-origin: bottom right;
    transition: transform 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}
nav a:hover::after, li a:hover::after {
    transform: scaleX(1);
    transform-origin: bottom left;
}
</style>
</head>
<body>
<main>
    <header>
        <h1>Nikhil Gupta</h1>
        <span class="dot"></span>
        <span id="version" style="font-size: 10px; color: var(--sub); opacity: 0.5; font-family: monospace; cursor: pointer;" title="Checking version..."></span>
        <button id="theme-toggle" aria-label="Toggle theme" style="margin-left: auto; background: none; border: none; cursor: pointer; color: var(--sub); padding: 0; display: flex;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path class="sun" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                <path class="moon" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" style="display: none;"></path>
            </svg>
        </button>
    </header>
    
    <nav>
        <a href="https://github.com/nikhi1g?tab=repositories">GitHub</a>
        <a href="https://www.linkedin.com/in/nikhil---gupta/">LinkedIn</a>
    </nav>

    <section>
        <ul>
            <li><a href="https://nikhi1g.github.io/mcat/index.html">MCAT</a></li>
            <li><a href="https://nikhi1g.github.io/SpotifyAdSkipper/">Spotify Ad Skipper</a></li>
            <li><a href="https://2022mechatronicsnikhilgupta.weebly.com/">Mechatronics Portfolio</a></li>
        </ul>
    </section>
</main>

<script>
// Theme Toggle
const toggle = document.getElementById('theme-toggle');
const sun = toggle.querySelector('.sun');
const moon = toggle.querySelector('.moon');
const root = document.documentElement;

const setTheme = (theme) => {
    root.setAttribute('data-theme', theme);
    localStorage.setItem('theme', theme);
    
    // Logic: If Dark, show Sun (to switch to Light). If Light, show Moon (to switch to Dark).
    if (theme === 'dark') {
        sun.style.display = 'block';
        moon.style.display = 'none';
    } else {
        sun.style.display = 'none';
        moon.style.display = 'block';
    }
};

// Init
const saved = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
setTheme(saved);

toggle.onclick = () => {
    const current = root.getAttribute('data-theme');
    setTheme(current === 'dark' ? 'light' : 'dark');
};

// Version Watcher
(async()=>{
    const el = document.getElementById('version');
    const dot = document.querySelector('.dot');
    const update = (d) => {
        if(!d||!d.commit) return;
        const h = d.commit.slice(0,7);
        el.textContent = h;
        el.title = d.message || '';
        
        const stored = sessionStorage.getItem('v');
        if(stored && stored !== h) {
            // Update available: Orange dot + Refresh text
            el.innerHTML = `${stored.slice(0,7)}&rarr;${h} <span style="font-size:12px">↻</span>`;
            el.onclick = (e) => {
                e.preventDefault();
                location.reload();
            };
            el.style.opacity = 1;
            el.style.color = '#f97316'; // Orange text
            dot.style.backgroundColor = '#f97316'; // Orange dot
        }
        sessionStorage.setItem('v', h);
    };
    try {
        const res = await fetch('commit.json?t='+Date.now());
        if(res.ok) update(await res.json());
    } catch(e){}
})();
</script>
</body>
</html>
