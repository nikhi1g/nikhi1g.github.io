<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<script>
// Resolve the theme before anything paints: a saved choice, else the system
// preference. Set here, in the head, so a dark page never paints light first.
(function () {
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    var dark = saved === 'dark' || (saved !== 'light'
        && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
})();
</script>
<meta name="description" content="Nikhil Gupta - Developer Portfolio">
<title>Nikhil Gupta</title>
<link rel="dns-prefetch" href="https://github.com">
<link rel="dns-prefetch" href="https://www.linkedin.com">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%233b82f6%22/></svg>">
<style>
:root {
    /* GitHub Light (Default) */
    --bg: #ffffff;
    --fg: #24292f;
    --acc: #0969da;
    --sub: #57606a;
}
html[data-theme="light"] {
    color-scheme: light;
}
html[data-theme="dark"] {
    color-scheme: dark;
}
/* The toggle shows the theme it switches TO. */
html[data-theme="dark"] #theme-toggle .moon,
html:not([data-theme="dark"]) #theme-toggle .sun {
    display: none;
}
html[data-theme="dark"] {
    /* GitHub Dark Dimmed */
    --bg: #22272e;
    --fg: #adbac7;
    --acc: #539bf5;
    --sub: #768390;
}
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
    background-color: var(--bg);
    color: var(--fg);
    line-height: 1.6;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    /* The visible height on mobile, where 100vh includes the browser bars. */
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.4s ease, color 0.4s ease;
    font-size: 18px; /* Increased base size */
}
main {
    width: 100%;
    max-width: 600px;
    padding: 2.5rem;
    animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    opacity: 0;
    transform: translateY(12px);
    outline: 1px solid var(--sub);
    border-radius: 12px;
}
@media (max-width: 600px) {
    main {
        padding: 1.5rem;
        border-radius: 0;
        outline: none;
        max-width: 100%;
        /* border-box so the padding fits inside the screen instead of adding
           3rem of scroll below it. */
        box-sizing: border-box;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }
    body {
        align-items: flex-start;
    }
}
@keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
}
header {
    margin-bottom: 3.5rem;
    display: flex;
    align-items: center; /* Changed from baseline to center for better icon alignment */
    gap: 16px;
    flex-wrap: wrap;
}
h1 {
    margin: 0;
    font-size: 2rem; /* Larger Title */
    font-weight: 700;
    letter-spacing: -0.03em;
}
.dot {
    width: 10px;
    height: 10px;
    background-color: var(--acc);
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
}
.pulse {
    animation: pulse 2s infinite;
}
@keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0.7); }
    70% { box-shadow: 0 0 0 10px rgba(249, 115, 22, 0); }
    100% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0); }
}
nav {
    display: flex;
    gap: 2rem;
    margin-bottom: 3.5rem;
    font-size: 1.15rem; /* Larger Nav */
}
section h2 {
    font-size: 1rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--sub);
    margin: 0 0 1.25rem 0;
    font-weight: 600;
}
ul {
    list-style: none;
    padding: 0;
    margin: 0;
}
.links-grid {
    display: flex;
    gap: 2rem;
}
.links-grid ul {
    flex: 1;
}
li {
    margin-bottom: 1rem;
    font-size: 1.1rem;
}
a {
    color: inherit;
    text-decoration: none;
    position: relative;
    transition: color 0.2s ease;
    padding: 4px 0; /* Larger tap target */
}
a:hover {
    color: var(--acc);
}
/* Subtle underline animation */
nav a::after, li a::after, #version::after {
    content: '';
    position: absolute;
    width: 100%;
    transform: scaleX(0);
    height: 2px; /* Thicker line */
    bottom: 4px; /* Move up slightly to underline text directly */
    left: 0;
    background-color: var(--acc);
    transform-origin: bottom right;
    transition: transform 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}
nav a:hover::after, li a:hover::after, #version:hover::after {
    transform: scaleX(1);
    transform-origin: bottom left;
}
#version {
    position: relative; /* Ensure ::after is positioned relative to this */
}
#version:hover {
    color: var(--acc) !important;
}
footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 2.5rem;
    padding-top: 1rem;
    border-top: 1px solid var(--sub);
    color: var(--sub);
    font-size: 0.8rem;
}
.copy-toast {
    position: fixed;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    pointer-events: none;
    color: var(--acc);
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.7);
    will-change: transform, opacity;
}
.copy-toast svg {
    width: 16px;
    height: 16px;
}
.copy-toast.show {
    animation: copy-float 0.7s ease-out forwards;
}
@keyframes copy-float {
    0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.7) rotate(-10deg);
    }
    15% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1) rotate(5deg);
    }
    100% {
        opacity: 0;
        transform: translate(-50%, calc(-50% - 28px)) scale(0.95) rotate(-3deg);
    }
}
@keyframes copy-sink {
    0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.7) rotate(10deg);
    }
    15% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1) rotate(-5deg);
    }
    100% {
        opacity: 0;
        transform: translate(-50%, calc(-50% + 28px)) scale(0.95) rotate(3deg);
    }
}
.copy-toast.show.down {
    animation-name: copy-sink;
}
#inquiry-email {
    cursor: pointer;
}
#inquiry-commit {
    cursor: pointer;
    font-family: monospace;
}
#inquiry-commit:hover {
    color: var(--acc);
}
#inquiry-email:focus-visible,
#inquiry-commit:focus-visible,
#version:focus-visible {
    outline: 2px solid var(--acc);
    outline-offset: 2px;
    border-radius: 3px;
}
@media (prefers-reduced-motion: reduce) {
    .copy-toast.show {
        animation: none;
        opacity: 1;
        transform: translate(-50%, -50%);
    }
}
</style>
</head>
<body>
<main>
    <header>
        <h1>Nikhil Gupta</h1>
        <span class="dot"></span>
        <span id="version" role="button" tabindex="0" style="font-size: 0.8rem; color: var(--sub); opacity: 0.6; font-family: monospace; cursor: pointer; padding: 4px;" title="Checking version..."></span>
        <button id="theme-toggle" aria-label="Toggle theme" style="margin-left: auto; background: none; border: none; cursor: pointer; color: var(--sub); padding: 8px; display: flex;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path class="sun" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                <path class="moon" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path>
            </svg>
        </button>
    </header>
    
    <nav>
        <a href="https://github.com/nikhi1g?tab=repositories">GitHub</a>
        <a href="https://www.linkedin.com/in/nikhil---gupta/">LinkedIn</a>
    </nav>

    <section class="links-grid">
        <ul>
            <li><a href="https://nikhi1g.github.io/mcat/index.html">MCAT</a></li>
            <li><a href="https://nikhi1g.github.io/153b/">153B</a></li>
            <li><a href="https://nikhi1g.github.io/ucla-emt-course/">UCLA EMT Course</a></li>
            <li><a href="https://nikhi1g.github.io/seminal_papers/">Seminal Papers</a></li>
        </ul>
        <ul>
            <li><a href="/whisper_hotkey/">whisper_hotkey</a></li>
            <li><a href="https://memlines.com/">mem lines</a></li>
        </ul>
    </section>

    <footer>
        <span>For any inquiries, please email <a id="inquiry-email" role="button" tabindex="0" title="Copy email">2nikhilg@gmail.com</a> with [<span id="inquiry-commit" role="button" tabindex="0" title="Copy commit">...</span>] in the subject line.</span>
    </footer>
</main>

<span id="copy-toast" class="copy-toast" role="status" aria-live="polite" aria-label="Copied">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="5" y="4" width="14" height="17" rx="2"></rect>
        <path d="M9 4V3h6v1"></path>
    </svg>
</span>

<script>
// Theme Toggle: the head script already applied the theme; this only flips it.
const toggle = document.getElementById('theme-toggle');
const root = document.documentElement;

toggle.onclick = () => {
    const theme = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', theme);
    try {
        localStorage.setItem('theme', theme);
    } catch {}
};

const inquiryEmail = document.getElementById('inquiry-email');
const copyToast = document.getElementById('copy-toast');
let copyToastTimer;
const inquiryCommitEl = document.getElementById('inquiry-commit');
const showCopyToast = (event, message, target, direction = 'up') => {
    const rect = target.getBoundingClientRect();
    const hasPointer = event.detail > 0 || event.clientX !== 0 || event.clientY !== 0;
    const x = hasPointer ? event.clientX : rect.left + rect.width / 2;
    const y = hasPointer ? event.clientY : rect.top + rect.height / 2;
    copyToast.setAttribute('aria-label', message);
    copyToast.style.left = `${x}px`;
    copyToast.style.top = `${y}px`;
    copyToast.classList.remove('show');
    copyToast.classList.toggle('down', direction === 'down');
    void copyToast.offsetWidth;
    copyToast.classList.add('show');
    clearTimeout(copyToastTimer);
    copyToastTimer = setTimeout(() => copyToast.classList.remove('show'), 700);
};
const copyText = async (text, event, target, direction) => {
    try {
        await navigator.clipboard.writeText(text);
        showCopyToast(event, 'Copied', target, direction);
    } catch {
        showCopyToast(event, 'Copy failed', target, direction);
    }
};
inquiryEmail.addEventListener('click', (event) => {
    event.preventDefault();
    copyText(inquiryEmail.textContent.trim(), event, inquiryEmail);
});
inquiryCommitEl.addEventListener('click', (event) => {
    event.preventDefault();
    copyText(inquiryCommitEl.textContent.trim(), event, inquiryCommitEl, 'down');
});

// The copy targets and the version label are spans acting as buttons, so they
// take Enter and Space like one.
for (const el of [inquiryEmail, inquiryCommitEl, document.getElementById('version')]) {
    el.addEventListener('keydown', (event) => {
        if (event.key !== 'Enter' && event.key !== ' ') return;
        event.preventDefault();
        el.click();
    });
}

// Version Watcher
(async()=>{
    const el = document.getElementById('version');
    const dot = document.querySelector('.dot');
    const inquiryCommit = document.getElementById('inquiry-commit');
    const setInquiryCommit = (commit) => {
        inquiryCommit.textContent = commit;
    };
    let localCommit = null;

    const check = async () => {
        try {
            const res = await fetch('commit.json?t='+Date.now());
            if(!res.ok) return;
            const d = await res.json();
            const remote = d.commit.slice(0,7);
            setInquiryCommit(remote);

            if(!localCommit) {
                // First load
                localCommit = remote;
                el.textContent = localCommit;
                el.title = d.message || '';
                el.onclick = () => window.location.href = `https://github.com/nikhi1g/nikhi1g.github.io/commit/${d.commit}`;
                sessionStorage.setItem('v', localCommit);
            } else if(localCommit !== remote) {
                // Update detected
                el.innerHTML = `${localCommit}&rarr;${remote} <span style="font-size:12px">↻</span>`;
                el.onclick = (e) => {
                    e.preventDefault();
                    location.reload();
                };
                el.style.opacity = 1;
                el.style.color = '#f97316'; // Orange text
                dot.style.backgroundColor = '#f97316'; // Orange dot
                dot.classList.add('pulse'); // Optional: add pulse if we had css
            }
        } catch(e){}
    };

    await check();
    setInterval(check, 30000); // Poll every 30s
    document.addEventListener('visibilitychange', () => {
        if(document.visibilityState === 'visible') check();
    });
})();
</script>
</body>
</html>
