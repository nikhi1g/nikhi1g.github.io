<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nikhil Gupta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Nikhil Gupta</h1>
        
        <nav>
            <a href="https://github.com/nikhi1g?tab=repositories">GitHub</a>
            <a href="https://www.linkedin.com/in/nikhil---gupta/">LinkedIn</a>
        </nav>

        <section>
            <h2>Projects</h2>
            <ul>
                <li><a href="https://nikhi1g.github.io/aminoacids/index.html">Amino Acids</a></li>
                <li><a href="https://nikhi1g.github.io/SpotifyAdSkipper/">Spotify Ad Skipper</a></li>
                <li><a href="https://2022mechatronicsnikhilgupta.weebly.com/">Mechatronics Portfolio</a></li>
            </ul>
        </section>
    </main>

    <div id="ground"></div>

    <div id="blob-container">
        <div class="blob">
            <div class="eye" id="eye-left">
                <div class="pupil"></div>
            </div>
            <div class="eye" id="eye-right">
                <div class="pupil"></div>
            </div>
            <div class="mouth"></div>
        </div>
    </div>

    <div id="version-sensor" class="sensor-loading">
        <span class="sensor-icon">●</span>
        <span class="sensor-text">Connecting...</span>
    </div>

    <script>
        // --- Custom Physics Engine ---
        const blobContainer = document.getElementById('blob-container');
        const blob = blobContainer.querySelector('.blob');
        const groundElement = document.getElementById('ground');
        
        // Physics State
        let state = 'waiting'; // waiting, falling, slumped, recovering, idle
        let pos = { x: 0, y: -400 }; // Start fully off screen (blob height 100 + pad)
        let vel = { x: 0, y: 0 };
        let scale = { x: 1, y: 1 };
        
        // Configuration
        const GRAVITY = 0.8; // Slightly heavier
        const GROUND_PAD = 20; 
        
        // Spring Physics (Jelly)
        let spring = {
            target: { x: 1, y: 1 },
            stiffness: 0.08, // Softer spring
            damping: 0.75,   // More wobble/bounce
            vel: { x: 0, y: 0 } 
        };

        // Screen dimensions
        let groundY = window.innerHeight - 100 - GROUND_PAD; 

        window.addEventListener('resize', () => {
            groundY = window.innerHeight - 100 - GROUND_PAD;
        });

        function updatePhysics() {
            if (state === 'waiting') return;

            // 1. Position Physics (Gravity)
            if (state === 'falling') {
                vel.y += GRAVITY;
                pos.y += vel.y;

                // Stretch based on velocity
                const stretchFactor = 1 + (Math.abs(vel.y) * 0.02); 
                scale.y = stretchFactor;
                scale.x = 1 / stretchFactor; 

                // Ground Collision
                if (pos.y >= groundY) {
                    pos.y = groundY;
                    vel.y = 0;
                    
                    // IMPACT!
                    state = 'slumped';
                    blob.classList.add('squished'); // Expression change
                    
                    // Violent squash on impact
                    scale.y = 0.3;
                    scale.x = 1.8;
                    
                    // Wait briefly in squished state, then recover
                    setTimeout(() => {
                        state = 'recovering';
                        blob.classList.remove('squished');
                        blob.classList.add('happy'); // Expression change
                    }, 500);
                }
            }

            // 2. Shape Physics (Spring System)
            if (state === 'recovering' || state === 'idle') {
                const forceX = (spring.target.x - scale.x) * spring.stiffness;
                const forceY = (spring.target.y - scale.y) * spring.stiffness;

                spring.vel.x += forceX;
                spring.vel.y += forceY;

                spring.vel.x *= spring.damping;
                spring.vel.y *= spring.damping;

                scale.x += spring.vel.x;
                scale.y += spring.vel.y;
                
                // Transition to idle when stable
                if (state === 'recovering' && 
                    Math.abs(spring.vel.y) < 0.001 && 
                    Math.abs(scale.y - 1) < 0.01) {
                    state = 'idle';
                }
            }

            // 3. Render
            blobContainer.style.transform = `translate(${pos.x}px, ${pos.y}px)`;
            blob.style.transform = `scale(${scale.x}, ${scale.y})`;

            requestAnimationFrame(updatePhysics);
        }

        requestAnimationFrame(updatePhysics);

        // Input Trigger
        document.addEventListener('mousemove', (e) => {
            if (state === 'waiting') {
                state = 'falling';
                pos.x = window.innerWidth - 150; 
                groundY = window.innerHeight - 100 - GROUND_PAD; 
                updatePhysics();
            }

            // Eye Tracking
            if (state !== 'waiting') {
                const eyes = document.querySelectorAll('.eye');
                eyes.forEach(eye => {
                    const pupil = eye.querySelector('.pupil');
                    const rect = eye.getBoundingClientRect();
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;
                    const angle = Math.atan2(e.clientY - centerY, e.clientX - centerX);
                    const distance = Math.min(3, Math.hypot(e.clientX - centerX, e.clientY - centerY) / 10);
                    
                    // Adjust pupil for the scale of the parent blob
                    // If blob is squashed (scale.y = 0.5), local Y movement needs to be inverted/scaled? 
                    // CSS transform nesting handles visual, but input coords are global.
                    // Simple offset is usually fine.
                    pupil.style.transform = `translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance}px)`;
                });
            }
        });

        // Window resize handler to keep blob on right
        window.addEventListener('resize', () => {
             if (state !== 'waiting') {
                 pos.x = window.innerWidth - 150;
                 groundY = window.innerHeight - 100 - GROUND_PAD;
                 if (state === 'idle') pos.y = groundY;
             }
        });

        // Version Sensor Script
        (function() {
            const REPO = 'nikhi1g/nikhi1g.github.io';
            const BRANCH = 'main';
            const SENSOR_EL = document.getElementById('version-sensor');
            const TEXT_EL = SENSOR_EL.querySelector('.sensor-text');
            const POLL_INTERVAL = 60000;

            let currentHash = null;
            let currentMsg = null;

            async function fetchLatestCommit() {
                try {
                    const response = await fetch(`https://api.github.com/repos/${REPO}/commits/${BRANCH}`);
                    if (!response.ok) throw new Error('API Error');
                    const data = await response.json();
                    return {
                        hash: data.sha.substring(0, 7),
                        msg: data.commit.message
                    };
                } catch (error) { return null; }
            }

            async function initSensor() {
                const commit = await fetchLatestCommit();
                if (commit) {
                    currentHash = commit.hash;
                    SENSOR_EL.classList.remove('sensor-loading');
                    SENSOR_EL.classList.add('sensor-active');
                    TEXT_EL.textContent = `v: ${currentHash}`;
                } else {
                    TEXT_EL.textContent = 'Offline';
                }
            }

            async function checkForUpdates() {
                if (!currentHash) return;
                const latest = await fetchLatestCommit();
                if (latest && latest.hash !== currentHash) {
                    SENSOR_EL.classList.add('sensor-update');
                    TEXT_EL.innerHTML = `
                        <span class="old-version">(${currentHash})</span> 
                        <span class="arrow">→</span> 
                        <span class="new-version">(${latest.hash})</span>
                        <span class="update-msg">New: ${latest.msg}</span>
                        <button class="sensor-reload-btn" onclick="window.location.reload()">Reload</button>
                    `;
                }
            }
            initSensor();
            setInterval(checkForUpdates, POLL_INTERVAL);
        })();
    </script>
</body>
</html>
