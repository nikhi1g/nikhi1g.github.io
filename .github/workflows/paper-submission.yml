name: Create paper submission PR

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-pull-request:
    if: startsWith(github.event.issue.title, '[Paper Submission] ')
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate submission and update JSON
        run: node .github/scripts/create-paper-submission.mjs

      - name: Report invalid submission
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "${ISSUE_NUMBER}" --body "This submission could not be validated. Check that every required field is present and that the paper is not already in the archive."

      - name: Create submission branch
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "paper-submission/issue-${ISSUE_NUMBER}"
          git add seminal_papers/submissions.json
          git commit -m "data: add paper submission from issue ${ISSUE_NUMBER}"
          git push origin "paper-submission/issue-${ISSUE_NUMBER}"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          PR_URL=$(gh pr create \
            --base main \
            --head "paper-submission/issue-${ISSUE_NUMBER}" \
            --title "${ISSUE_TITLE}" \
            --body "Adds the structured paper submission from #${ISSUE_NUMBER}. Review the title, destination, and metadata before merging.")
          gh issue comment "${ISSUE_NUMBER}" --body "Created ${PR_URL} for review."
